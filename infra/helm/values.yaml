pythonJob:
  enabled: false
  name: "python-job"
  scriptContent: ""
  requirementsContent: ""
  backoffLimit: 4
  ttlSecondsAfterFinished: 100
  restartPolicy: Never
  env: {}        # plain settings -> container environment variables (set by infra/eks.tf)
  secretEnv: {}  # sensitive settings (e.g. passwords) -> Kubernetes Secret, loaded via envFrom
  hostNetwork: false  # true = use the node's network, so the pod can reach IMDS (hop limit 1) for the node role's credentials
  image:
    repository: jupyter/all-spark-notebook
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1.0
      memory: 2Gi
    requests:
      cpu: 0.5
      memory: 1Gi
