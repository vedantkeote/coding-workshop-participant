proxy:
  service:
    type: ClusterIP

hub:
  config:
    JupyterHub:
      authenticator_class: ldapauthenticator.LDAPAuthenticator
    LDAPAuthenticator:
      server_address: "corp.codingworkshop.net"
      server_port: 389
      server_args:
        get_info: "ALL"
      tls_strategy: "insecure"
      user_attribute: "sAMAccountName"
      bind_dn_template:
        - "CN={username},OU=Users,OU=CORP,DC=corp,DC=codingworkshop,DC=net"
  db:
    type: sqlite-memory

singleuser:
  image:
    name: jupyter/all-spark-notebook
    tag: latest
  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 2Gi
    guarantee: 1Gi
  storage:
    type: "none"
    extraVolumes:
      - name: scratch-volume
        emptyDir: {}
    extraVolumeMounts:
      - name: scratch-volume
        mountPath: /var/run/jupyter
  # Notebook servers read the data lake with the node role's credentials. The nodes enforce IMDSv2
  # with hop limit 1, so (like the data job) they must use the node's network.
  extraPodConfig:
    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet
  # The default metadata block is an iptables rule set by a privileged init container; with
  # hostNetwork it would land in the NODE's firewall and cut off IMDS for the whole node.
  cloudMetadata:
    blockWithIptables: false

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: true
    replicas: 1
